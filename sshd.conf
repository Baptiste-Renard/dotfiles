# copy this file to /etc/ssh/sshd_config.d/
# Usually /etc/ssh/sshd_config includes /etc/ssh/sshd_config.d/*.conf.
# If not, add "Include /etc/ssh/sshd_config.d/*.conf" to /etc/ssh/sshd_config
# Make sure that the directory /etc/ssh/sshd_config.d belongs to root.

# See man 5 sshd_config
# Check with validity `sudo /usr/sbin/sshd -t`

PermitRootLogin no
# Only allow pubickey authentification
AuthenticationMethods publickey

# Disable old protocols
Protocol 2

MaxAuthTries 6
MaxSessions 10
MaxStartups 10:30:80
