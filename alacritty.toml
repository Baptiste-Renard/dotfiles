#https://alacritty.org/config-alacritty.html
#man 5 alacritty
[general]
import = ["~/.alacritty.local.toml"]

[env]
TERM = "xterm-256color"
resize_increments = "True"      # discrete steps equal to cell dimensions

[window]
opacity=1
blur=true
#decorations = "None"
#startup_mode = "Maximized"      # Or "Fullscreen"
dynamic_title = true

[mouse]
hide_when_typing = true

[terminal.shell]
program = "/bin/sh"
args = ["-c", "if command -v tmux >/dev/null 2>&1; then exec tmux new-session -A -s main; else exec \"${SHELL:-/bin/sh}\"; fi"]
